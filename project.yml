name: MyWorkDock

options:
  bundleIdPrefix: com.adityabuilds
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

# Google OAuth client for My Calendar (empty defaults + the gitignored GoogleOAuth.xcconfig).
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

targets:
  MyWorkDock:
    type: application
    platform: macOS
    sources:
      - path: MyWorkDock
      - path: Shared
    dependencies:
      - package: Sparkle
      # The agent hook ships inside the app (Contents/MacOS/mwd-hook); see Features/Agents.
      - target: mwd-hook
        embed: true
        codeSign: false
        copy:
          destination: executables
    # Sparkle OTA: appcast.xml is attached to every GitHub release; the public key verifies update signatures (private key lives in the login Keychain).
    # Custom keys can't go through INFOPLIST_KEY_*, so XcodeGen writes this partial plist and Xcode merges the generated keys into it.
    info:
      path: MyWorkDock/Info.plist
      properties:
        SUFeedURL: https://github.com/aditya-thummar-devx/my-work-dock/releases/latest/download/appcast.xml
        SUPublicEDKey: HKw1PhCjx1ETFWAtSS179yk9rDpuHWp0oVLMZtO1EOg=
        # My Calendar's Google OAuth client, filled from Config/GoogleOAuth.xcconfig at build time; empty = "sign-in not configured".
        GoogleClientID: $(GOOGLE_CLIENT_ID)
        GoogleClientSecret: $(GOOGLE_CLIENT_SECRET)
    settings:
      base:
        PRODUCT_NAME: MyWorkDock
        PRODUCT_BUNDLE_IDENTIFIER: com.adityabuilds.myworkdock
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: MyWorkDock
        # adb servers this app spawns inherit its Local Network permission; without it, wireless pair/connect get "No route to host".
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Pairs and connects Android devices over Wi-Fi.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Not sandboxed: it shells out to xcrun, adb, emulator, claudex.
        ENABLE_APP_SANDBOX: NO
        # Off: hardened runtime's library validation refuses the embedded Sparkle.framework when everything is ad-hoc signed ("different Team IDs").
        # Turn it back on with a Developer ID identity when notarizing.
        ENABLE_HARDENED_RUNTIME: NO
        # Ad-hoc signing for local dev.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
      configs:
        Release:
          # Xcode adds the debugger entitlement (get-task-allow) to ad-hoc builds; Debug needs it to attach, shipped builds don't.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  mwd-hook:
    type: tool
    platform: macOS
    sources:
      - path: MWDHook
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: mwd-hook
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES

  MyWorkDockTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MyWorkDockTests
    dependencies:
      - target: MyWorkDock
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.adityabuilds.myworkdock.tests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

schemes:
  MyWorkDock:
    build:
      targets:
        MyWorkDock: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MyWorkDockTests
