name: MyWorkDock

options:
  bundleIdPrefix: com.adityabuilds
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MyWorkDock:
    type: application
    platform: macOS
    sources:
      - path: MyWorkDock
      - path: Shared
    dependencies:
      # The agent hook ships inside the app (Contents/MacOS/mwd-hook); see Features/Agents.
      - target: mwd-hook
        embed: true
        codeSign: false
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_NAME: MyWorkDock
        PRODUCT_BUNDLE_IDENTIFIER: com.adityabuilds.myworkdock
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: MyWorkDock
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Not sandboxed: it shells out to xcrun, adb, emulator, claudex.
        ENABLE_APP_SANDBOX: NO
        # Needed for notarization later; no entitlement exceptions required to spawn processes.
        ENABLE_HARDENED_RUNTIME: YES
        # Ad-hoc signing for local dev.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

  mwd-hook:
    type: tool
    platform: macOS
    sources:
      - path: MWDHook
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: mwd-hook
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES

  MyWorkDockTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MyWorkDockTests
    dependencies:
      - target: MyWorkDock
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.adityabuilds.myworkdock.tests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

schemes:
  MyWorkDock:
    build:
      targets:
        MyWorkDock: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MyWorkDockTests
